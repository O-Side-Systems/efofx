[package]
name = "efofx-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MongoDB adapter and tenant-aware repository primitives. TenantContext gates every tenant-scoped read/write at compile time."

[dependencies]
efofx-domain.workspace = true
efofx-config.workspace = true

tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
mongodb.workspace = true
time.workspace = true
utoipa.workspace = true
uuid.workspace = true

# HMAC-SHA256 for widget API-key verification — constant-time comparison
# avoids bcrypt's per-request cost while still resisting timing oracles.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
trybuild.workspace = true

[lints.rust]
unsafe_code = "forbid"
