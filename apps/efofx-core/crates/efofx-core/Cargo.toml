[package]
name = "efofx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "efofx platform core HTTP server (Axum). Hosts the authoritative API for chat, estimation, widget, feedback, and partner routing."

[lib]
name = "efofx_core"
path = "src/lib.rs"

[[bin]]
name = "efofx-core"
path = "src/main.rs"

# Operational binary: one-shot seeder that upserts platform-scoped reference
# classes and projects from JSON fixtures under `config/reference-data/`.
[[bin]]
name = "seed-references"
path = "src/bin/seed-references.rs"

[dependencies]
efofx-domain.workspace = true
efofx-config.workspace = true
efofx-storage.workspace = true
efofx-openapi.workspace = true
efofx-auth.workspace = true
efofx-crypto.workspace = true
efofx-prompts.workspace = true
efofx-llm.workspace = true
efofx-email.workspace = true

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

async-stream.workspace = true
futures.workspace = true

serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
utoipa.workspace = true
reqwest.workspace = true
time.workspace = true
governor.workspace = true

[dev-dependencies]
tower.workspace = true
hyper.workspace = true
http-body-util = "0.1"
jsonwebtoken.workspace = true
wiremock = "0.6"
efofx-email.workspace = true
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
base64 = "0.22"
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
