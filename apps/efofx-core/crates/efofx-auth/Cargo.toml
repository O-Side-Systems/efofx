[package]
name = "efofx-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication middleware. Verifies Supabase JWTs via JWKS and widget API keys, mints the single TenantContext consumed by every handler."

[dependencies]
efofx-domain.workspace = true
efofx-config.workspace = true
efofx-storage.workspace = true
efofx-openapi.workspace = true

tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true

jsonwebtoken.workspace = true
reqwest.workspace = true

[dev-dependencies]
wiremock = "0.6"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"
